plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'maven-publish'
	id "com.gradleup.shadow" version "9.2.2"
}

base {
	archivesName = project.archives_base_name
}

group = project.maven_group
version = "mc" + project.minecraft_version + "-" + project.mod_version
def semver_version = project.mod_version + "+mc" + project.minecraft_version

sourceSets.main.java.srcDirs += 'java'
sourceSets.main.resources.srcDirs += 'resources'

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://maven.blamejared.com/" }
	maven { url "https://modmaven.dev" }
	maven { url "https://cursemaven.com" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modCompileOnly "curse.maven:configured-457570:7332058"

	implementation (shadow "blue.endless:jankson:1.2.3")

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

processResources {
	inputs.property "version", semver_version

	filesMatching("fabric.mod.json") {
		expand "version": semver_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

task apiJar(type: Jar, dependsOn: classes) {
	archiveClassifier.set "api"

	from sourceSets.main.output
	include "squeek/appleskin/api/**"
}

shadowJar {
	relocate "blue.endless.jankson", "${project.maven_group}.shadowed.blue.endless.jankson"
	configurations = [project.configurations.shadow]
	archiveClassifier = "shadow"

	destinationDirectory = layout.buildDirectory.dir('shadowlibs')
}

remapJar {
	input.set(shadowJar.archiveFile)
	dependsOn(shadowJar)

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

artifacts {
 	archives sourcesJar
 	archives apiJar
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = group
			artifactId = project.archives_base_name

			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
			artifact(apiJar)
		}
	}

	repositories {
		maven {
			url = project.findProperty("maven.url") ?: System.getenv("MAVEN_URL")
			credentials {
				username=project.findProperty("maven.user") ?: System.getenv("MAVEN_USER")
				password=project.findProperty("maven.password") ?: System.getenv("MAVEN_PASSWORD")
			}
		}
	}
}
